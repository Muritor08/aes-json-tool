<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#0b2a6f"
    />

    <meta
      name="description"
      content="Universal AES encryption and decryption tool"
    />

    <!-- Content Security Policy -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self';
        style-src 'self';
        img-src 'self' data:;
        font-src 'self' data:;
        connect-src 'self';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
        upgrade-insecure-requests;
      "
    />

    <!-- Referrer Policy -->
    <meta
      name="referrer"
      content="no-referrer"
    />

    <link
      rel="stylesheet"
      href="./src/styles.css"
    />

    <title>Universal AES Encryption Tool</title>

    <link
      rel="icon"

    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32.png"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon-180.png"
    />
  </head>
